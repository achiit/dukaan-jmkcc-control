<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JMKCC Admin Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FB;--card:#FFFFFF;--primary:#4F46E5;--primary-light:#EEF2FF;--green:#10B981;--green-light:#D1FAE5;--red:#EF4444;--red-light:#FEE2E2;--yellow:#F59E0B;--yellow-light:#FEF3C7;--blue:#3B82F6;--blue-light:#DBEAFE;--text:#0F172A;--text-mid:#475569;--text-light:#94A3B8;--border:#E2E8F0;--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow-md:0 4px 12px rgba(15,23,42,.08);--shadow-xl:0 20px 60px rgba(15,23,42,.25);--grad-primary:linear-gradient(135deg,#6366F1 0%,#4F46E5 50%,#3730A3 100%);--grad-green:linear-gradient(135deg,#34D399,#10B981);--grad-red:linear-gradient(135deg,#F87171,#EF4444);--font:'Plus Jakarta Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:var(--font);}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);}
.hidden{display:none!important;}
button{cursor:pointer;border:none;font-family:inherit;font-weight:700;transition:.2s;}
button:active{transform:scale(.96);}
input,select,textarea{font-family:inherit;outline:none;user-select:text;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:6px;}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 20% 20%,#4F46E5 0%,transparent 50%),radial-gradient(circle at 80% 80%,#7C3AED 0%,transparent 50%),radial-gradient(circle at 50% 50%,#1E1B4B 0%,#0F172A 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;color:#fff;overflow:hidden;}
.login-box{width:100%;max-width:380px;background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border-radius:24px;padding:32px 24px;border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#fff,#E0E7FF);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px;box-shadow:0 15px 40px rgba(79,70,229,.4);}
#login-screen h1{font-size:26px;font-weight:800;margin-bottom:6px;text-align:center;}
#login-screen .subtitle{opacity:.85;margin-bottom:28px;font-size:13px;text-align:center;font-weight:500;}
.login-input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px;font-weight:600;margin-bottom:12px;}
.login-input::placeholder{color:rgba(255,255,255,.6);}
.login-input:focus{border-color:#fff;background:rgba(255,255,255,.15);}
#login-btn{width:100%;padding:15px;border-radius:12px;background:linear-gradient(135deg,#34D399,#10B981);color:#fff;font-size:15px;font-weight:800;margin-top:8px;box-shadow:0 8px 25px rgba(16,185,129,.4);}
#denied-msg{background:rgba(239,68,68,.15);color:#FCA5A5;padding:14px;border-radius:12px;margin-top:16px;font-size:12px;font-weight:600;border:1px solid rgba(239,68,68,.3);text-align:center;}

/* APP */
#admin-app{display:flex;flex-direction:column;height:100vh;}
.topbar{background:var(--grad-primary);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(79,70,229,.3);z-index:50;}
.icon-btn-top{background:rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;}
.topbar-title{font-size:16px;font-weight:800;flex:1;text-align:center;}
.logout-btn{background:rgba(255,255,255,.15);color:#fff;padding:0 14px;height:38px;border-radius:12px;font-size:12px;font-weight:800;}
#drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:150;display:none;backdrop-filter:blur(4px);}
#drawer-overlay.active{display:block;}
#sidebar{position:fixed;top:0;left:-290px;width:280px;height:100vh;background:#fff;z-index:200;transition:left .3s;box-shadow:4px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column;}
#sidebar.open{left:0;}
.sb-header{background:var(--grad-primary);color:#fff;padding:24px 20px;}
.sb-header h2{font-size:18px;font-weight:800;}
.sb-header p{font-size:11px;opacity:.85;margin-top:4px;word-break:break-all;}
.sb-menu{flex:1;overflow-y:auto;padding:12px 0;}
.sb-item{display:flex;align-items:center;gap:12px;padding:12px 20px;font-size:13.5px;font-weight:700;color:var(--text-mid);cursor:pointer;margin:2px 8px;border-radius:10px;}
.sb-item:hover,.sb-item.active{background:var(--primary-light);color:var(--primary);}
.sb-item .ico{font-size:18px;width:24px;text-align:center;}
#content{flex:1;overflow-y:auto;padding:16px;padding-bottom:40px;}
.section-title{font-size:22px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.add-btn{background:var(--grad-green);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--grad-primary);}
.stat-card.green::before{background:var(--grad-green);}.stat-card.yellow::before{background:linear-gradient(135deg,#FBBF24,#F59E0B);}.stat-card.red::before{background:var(--grad-red);}.stat-card.blue::before{background:linear-gradient(135deg,#60A5FA,#3B82F6);}
.stat-card h3{font-size:32px;font-weight:800;line-height:1;}
.stat-card p{font-size:11px;color:var(--text-light);font-weight:800;margin-top:8px;text-transform:uppercase;}
.filter-bar{display:flex;gap:6px;margin-bottom:14px;background:#fff;padding:6px;border-radius:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.filter-tab{flex:1;padding:10px;border-radius:10px;font-size:12px;font-weight:800;background:transparent;color:var(--text-light);}
.filter-tab.active{background:var(--grad-primary);color:#fff;}
.search-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.search-bar input{flex:1;border:none;background:transparent;font-size:14px;font-weight:600;}
.item-card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;}
.item-info{flex:1;min-width:0;}.item-info h4{font-size:14px;font-weight:800;margin-bottom:6px;word-break:break-word;}
.item-info p{font-size:11px;color:var(--text-light);line-height:1.5;font-weight:600;}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.badge{display:inline-block;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:6px;margin-right:4px;text-transform:uppercase;}
.badge.green{background:var(--green-light);color:#059669;}.badge.red{background:var(--red-light);color:#DC2626;}.badge.yellow{background:var(--yellow-light);color:#D97706;}.badge.blue{background:var(--blue-light);color:#2563EB;}.badge.purple{background:#EDE9FE;color:#7C3AED;}
.act-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--primary-light);color:var(--primary);}
.act-btn.del{background:var(--red-light);color:var(--red);}
.act-btn.publish{background:var(--green-light);color:#059669;}
.act-btn.draft{background:var(--yellow-light);color:#D97706;}
.act-btn.wide{width:auto;padding:0 12px;font-size:11px;font-weight:800;gap:4px;}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:300;display:none;justify-content:center;align-items:center;padding:16px;backdrop-filter:blur(6px);}
#modal.active{display:flex;}
.modal-box{background:#fff;border-radius:24px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow-xl);}
.modal-box h3{font-size:20px;font-weight:800;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:var(--bg);color:var(--text-mid);width:34px;height:34px;border-radius:50%;font-size:18px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:800;color:var(--text-mid);margin-bottom:6px;text-transform:uppercase;}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:#F8FAFC;color:var(--text);font-weight:600;}
.form-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--primary-light);}
textarea.form-input{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#F8FAFC;border-radius:12px;margin-bottom:10px;border:1px solid var(--border);}
.toggle-row label{font-size:13px;font-weight:800;}
.switch{position:relative;width:46px;height:26px;background:#CBD5E1;border-radius:13px;cursor:pointer;}
.switch.on{background:var(--green);}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;}
.switch.on::after{left:23px;}
.btn-primary{background:var(--grad-primary);color:#fff;padding:14px;border-radius:12px;font-size:14px;font-weight:800;width:100%;margin-top:8px;}
.btn-secondary{background:#F1F5F9;color:var(--text);padding:14px;border-radius:12px;font-size:14px;font-weight:800;width:100%;margin-top:8px;}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.q-builder{background:var(--primary-light);border-radius:14px;padding:14px;margin-bottom:12px;position:relative;border:1px solid #C7D2FE;}
.q-num{background:var(--primary);color:#fff;display:inline-block;padding:4px 12px;border-radius:8px;font-size:11px;font-weight:800;margin-bottom:10px;}
.q-remove{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;width:28px;height:28px;border-radius:8px;font-size:14px;}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#fff;padding:8px;border-radius:10px;}
.opt-row input[type="radio"]{width:18px;height:18px;accent-color:var(--green);}
.opt-row input[type="text"]{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
.opt-row .opt-label{font-size:10px;font-weight:800;color:var(--text-light);width:20px;}
.empty{text-align:center;padding:50px 20px;color:var(--text-light);font-weight:600;}
.empty .big{font-size:56px;margin-bottom:14px;opacity:.6;}
.loader{width:44px;height:44px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(150%);background:var(--text);color:#fff;padding:14px 24px;border-radius:14px;font-size:13px;font-weight:700;z-index:500;transition:.3s;box-shadow:var(--shadow-xl);}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.error{background:var(--red);}#toast.success{background:var(--green);}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quick-btn{background:#fff;border-radius:16px;padding:16px;font-size:13px;font-weight:800;color:var(--text);box-shadow:var(--shadow-sm);border:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.quick-btn .emoji{font-size:22px;}
@media(min-width:800px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
</style>
</head>
<body>

<!-- LOGIN (Email + Password) -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🎛️</div>
    <h1>JMKCC Admin</h1>
    <p class="subtitle">Enter your credentials</p>
    <input class="login-input" type="email" id="login-email" placeholder="Email" autocomplete="email">
    <input class="login-input" type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
    <button id="login-btn" onclick="loginWithEmail()">🔓 Login</button>
    <div id="denied-msg" class="hidden"></div>
  </div>
</div>

<div id="admin-app" class="hidden">
  <header class="topbar">
    <button class="icon-btn-top" onclick="toggleDrawer()">☰</button>
    <div class="topbar-title" id="page-title">Dashboard</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>
  <div id="drawer-overlay" onclick="toggleDrawer()"></div>
  <aside id="sidebar">
    <div class="sb-header"><h2>🎛️ Admin Pro</h2><p id="admin-email">—</p></div>
    <div class="sb-menu" id="sb-menu"></div>
  </aside>
  <main id="content"></main>
</div>

<div id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ============ ADMIN EMAIL ============ */
const ADMIN_EMAILS = ["jmkcc425@gmail.com"];
/* ==================================== */

const firebaseConfig = { apiKey:"AIzaSyBvSzyAokTjxghA1kE1Ax97j4q_HeADtRI", authDomain:"jmkcc-c09c7.firebaseapp.com", projectId:"jmkcc-c09c7", storageBucket:"jmkcc-c09c7.firebasestorage.app", messagingSenderId:"659653592447", appId:"1:659653592447:web:6d442dc59550f14226c64a" };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CLASSES = ['9th','10th','11th','12th'];
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let currentAdmin = null;
let testQuestions = [];

const cache = { ttl: 30000, data: {} };
function cacheGet(k){ const c=cache.data[k]; if(c && Date.now()-c.time<cache.ttl) return c.val; return null; }
function cacheSet(k,v){ cache.data[k]={val:v,time:Date.now()}; }
function cacheClear(k){ if(k) delete cache.data[k]; else cache.data={}; }

/* ============ AUTH - EMAIL/PASSWORD ============ */
onAuthStateChanged(auth, user => {
  if(user){
    if(ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((user.email||'').toLowerCase())){
      currentAdmin = user;
      $('login-screen').classList.add('hidden');
      $('admin-app').classList.remove('hidden');
      $('admin-email').innerText = user.email;
      buildSidebar(); navigate('dashboard');
    } else {
      $('denied-msg').classList.remove('hidden');
      $('denied-msg').innerHTML = `❌ ${esc(user.email)} admin nahi hai`;
      setTimeout(()=>signOut(auth), 2000);
    }
  } else {
    currentAdmin = null;
    $('login-screen').classList.remove('hidden');
    $('admin-app').classList.add('hidden');
    $('denied-msg').classList.add('hidden');
    $('login-btn').disabled = false;
    $('login-btn').textContent = '🔓 Login';
  }
});

window.loginWithEmail = async () => {
  const email = $('login-email').value.trim();
  const pass = $('login-pass').value;
  const btn = $('login-btn');
  if(!email || !pass) return toast('Email + Password daalo', 'error');
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    // First time: account create
    if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials') {
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        toast('✅ Account created!');
      } catch(e2) {
        toast('❌ ' + e2.message, 'error');
        btn.disabled = false; btn.textContent = '🔓 Login';
      }
    } else {
      toast('❌ ' + e.message, 'error');
      btn.disabled = false; btn.textContent = '🔓 Login';
    }
  }
};

// Enter key se login
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !$('login-screen').classList.contains('hidden')) loginWithEmail();
});

window.logout = async () => { if(confirm('Logout?')) await signOut(auth); };

/* ============ UI ============ */
window.toggleDrawer = () => { $('sidebar').classList.toggle('open'); $('drawer-overlay').classList.toggle('active'); };
function closeDrawer(){ $('sidebar').classList.remove('open'); $('drawer-overlay').classList.remove('active'); }
window.toast = (msg, type='success') => { const t=$('toast'); t.innerText=msg; t.className=type+' show'; clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2500); };
window.openModal = html => { $('modal-box').innerHTML=html; $('modal').classList.add('active'); };
window.closeModal = () => $('modal').classList.remove('active');

const MENU = [
  {id:'dashboard',icon:'📊',label:'Dashboard'},{id:'settings',icon:'⚙️',label:'App Settings'},
  {id:'banners',icon:'🖼️',label:'Banners'},{id:'courses',icon:'📚',label:'Courses'},
  {id:'subjects',icon:'📖',label:'Subjects'},{id:'tests',icon:'📝',label:'Tests'},
  {id:'notes',icon:'📄',label:'Notes'},{id:'ncert',icon:'📕',label:'NCERT Books'},
  {id:'papers',icon:'📋',label:'Papers'},{id:'timetable',icon:'📅',label:'Timetable'},
  {id:'notifications',icon:'🔔',label:'Notifications'},{id:'payments',icon:'💳',label:'Payments'},
  {id:'doubts',icon:'❓',label:'Doubts'},{id:'users',icon:'👥',label:'Users'},
];
function buildSidebar(){ $('sb-menu').innerHTML = MENU.map(m=>`<div class="sb-item" data-id="${m.id}" onclick="navigate('${m.id}')"><span class="ico">${m.icon}</span> ${m.label}</div>`).join(''); }

const sections = { dashboard:renderDashboard, settings:renderSettings, banners:renderBanners, courses:renderCourses, subjects:renderSubjects, tests:renderTests, notes:renderNotes, ncert:renderNcert, papers:renderPapers, timetable:renderTimetable, notifications:renderNotifications, payments:renderPayments, doubts:renderDoubts, users:renderUsers };

window.navigate = async sec => {
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active', el.dataset.id===sec));
  const menu = MENU.find(m=>m.id===sec);
  $('page-title').innerText = menu?menu.label:'Admin';
  $('content').innerHTML = '<div class="loader"></div>';
  closeDrawer();
  try { await sections[sec](); }
  catch(e){ $('content').innerHTML = `<div class="empty"><div class="big">⚠️</div>Error: ${esc(e.message)}</div>`; }
};

async function fetchAll(colName,useCache=false){
  const key='all_'+colName;
  if(useCache){ const c=cacheGet(key); if(c) return c; }
  const snap = await getDocs(collection(db,colName));
  const data = snap.docs.map(d=>({id:d.id,...d.data()}));
  cacheSet(key,data);
  return data;
}
async function create(col,data){ await addDoc(collection(db,col),data); cacheClear('all_'+col); }
async function update(col,id,data){ await updateDoc(doc(db,col,id),data); cacheClear('all_'+col); }
async function remove(col,id){ await deleteDoc(doc(db,col,id)); cacheClear('all_'+col); }

window._filters={}; window._searches={};
function getFilter(k){ return window._filters[k]||'all'; }
function getSearch(k){ return (window._searches[k]||'').toLowerCase(); }
window.setFilter=(k,v,f)=>{ window._filters[k]=v; window[f](); };
window.setSearch=(k,v,f)=>{ window._searches[k]=v; window[f](); };
function filterBar(key,fn){ const cur=getFilter(key); return `<div class="filter-bar">${['all','live','draft'].map(f=>`<button class="filter-tab ${cur===f?'active':''}" onclick="setFilter('${key}','${f}','${fn}')">${f==='all'?'📋 All':f==='live'?'🟢 Live':'🔴 Draft'}</button>`).join('')}</div>`; }
function searchBar(key,fn,p='Search...'){ return `<div class="search-bar"><span>🔍</span><input placeholder="${p}" value="${esc(window._searches[key]||'')}" oninput="setSearch('${key}',this.value,'${fn}')"></div>`; }
function applyFilterSearch(items,key,tf='title'){ let f=items; const filter=getFilter(key); if(filter==='live') f=f.filter(i=>i.isPublished!==false); else if(filter==='draft') f=f.filter(i=>i.isPublished===false); const s=getSearch(key); if(s) f=f.filter(i=>(i[tf]||'').toLowerCase().includes(s)); return f; }

async function renderDashboard(){
  const [users,courses,tests,payments,doubts] = await Promise.all([fetchAll('users'),fetchAll('courses'),fetchAll('tests'),fetchAll('payments'),fetchAll('doubts')]);
  const pendingPay = payments.filter(p=>p.status==='pending').length;
  const pendingDoubt = doubts.filter(d=>d.status==='pending').length;
  const liveCourses = courses.filter(c=>c.isPublished!==false).length;
  const draftCourses = courses.filter(c=>c.isPublished===false).length;
  $('content').innerHTML = `
    <div class="section-title">📊 Overview</div>
    <div class="stats-grid">
      <div class="stat-card blue"><h3>${users.length}</h3><p>Students</p></div>
      <div class="stat-card green"><h3>${liveCourses}</h3><p>Live Courses</p></div>

  const isPapers = col==='papers';
  const data = { title:$('d-title').value, class:$('d-class').value, pdfUrl:$('d-pdfUrl').value, isPublished:publish };
  if(isPapers) data.desc = $('d-desc').value; else data.subject = $('d-subject').value;
  if(!data.title) return toast('Title required','error');
  try{ if(id) await update(col,id,data); else await create(col,data); toast(publish?'🚀 Published!':'📄 Draft saved'); closeModal(); window[fn](); }catch(e){ toast('Error: '+e.message,'error'); }
};

async function renderTimetable(){ const all = await fetchAll('timetable'); const filtered = applyFilterSearch(all,'timetable','day'); $('content').innerHTML = `<div class="section-title">📅 Timetable <button class="add-btn" onclick="editTT()">➕ Add</button></div>${filterBar('timetable','renderTimetable')}${filtered.length===0?'<div class="empty"><div class="big">📅</div>Koi entry nahi</div>':''}${filtered.map(n=>`<div class="item-card"><div class="item-info"><h4>${esc(n.day||'—')} — ${esc(n.subject||'—')}</h4><p><span class="badge blue">${esc(n.class||'—')}</span><span class="badge purple">${esc(n.time||'')}</span><span class="badge ${n.isPublished!==false?'green':'red'}">${n.isPublished!==false?'🟢':'🔴'}</span></p></div><div class="item-actions">${n.isPublished===false?`<button class="act-btn publish wide" onclick="quickPublish('timetable','${n.id}','renderTimetable')">🚀</button>`:`<button class="act-btn draft wide" onclick="quickUnpublish('timetable','${n.id}','renderTimetable')">⏸</button>`}<button class="act-btn" onclick='editTT(${JSON.stringify(n).replace(/'/g,"&apos;")})'>✏️</button><button class="act-btn del" onclick="delItem('timetable','${n.id}','renderTimetable')">🗑</button></div></div>`).join('')}`; }
window.editTT = (t={}) => openModal(`<h3>${t.id?'✏️ Edit':'➕ Add'} Timetable <button class="modal-close" onclick="closeModal()">✕</button></h3><div class="form-row"><div class="form-group"><label>Class</label><select class="form-input" id="tt-class">${CLASSES.map(x=>`<option ${t.class===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Day</label><input class="form-input" id="tt-day" value="${esc(t.day||'')}"></div></div><div class="form-row"><div class="form-group"><label>Subject</label><input class="form-input" id="tt-subject" value="${esc(t.subject||'')}"></div><div class="form-group"><label>Time</label><input class="form-input" id="tt-time" value="${esc(t.time||'')}"></div></div><div class="btn-group"><button class="btn-secondary" onclick="saveTT('${t.id||''}',false)">📄 Draft</button><button class="btn-primary" style="margin-top:0" onclick="saveTT('${t.id||''}',true)">🚀 Live</button></div>`);
window.saveTT = async (id,publish) => { const data={class:$('tt-class').value,day:$('tt-day').value,subject:$('tt-subject').value,time:$('tt-time').value,isPublished:publish}; try{ if(id) await update('timetable',id,data); else await create('timetable',data); toast('Saved!'); closeModal(); renderTimetable(); }catch(e){ toast('Error: '+e.message,'error'); } };

async function renderNotifications(){
  const q = query(collection(db,"notifications"),orderBy("createdAt","desc"),limit(30));
  const snap = await getDocs(q);
  const list = snap.docs.map(d=>({id:d.id,...d.data()}));
  $('content').innerHTML = `<div class="section-title">🔔 Notifications <button class="add-btn" onclick="addNotif()">➕ Send</button></div>${list.length===0?'<div class="empty"><div class="big">🔔</div>Koi notification nahi</div>':''}${list.map(n=>`<div class="item-card"><div class="item-info"><h4>${esc(n.title||'—')}</h4><p>${esc(n.message||'')}</p></div><div class="item-actions"><button class="act-btn del" onclick="delItem('notifications','${n.id}','renderNotifications')">🗑</button></div></div>`).join('')}`;
}
window.addNotif = () => openModal(`<h3>🔔 Send Notification <button class="modal-close" onclick="closeModal()">✕</button></h3><div class="form-group"><label>Title</label><input class="form-input" id="n-title"></div><div class="form-group"><label>Message</label><textarea class="form-input" id="n-message" rows="4"></textarea></div><button class="btn-primary" onclick="saveNotif()">🚀 Send to All</button>`);
window.saveNotif = async () => { const t=$('n-title').value, m=$('n-message').value; if(!t||!m) return toast('Title + Message required','error'); await create('notifications',{title:t,message:m,createdAt:serverTimestamp()}); toast('🚀 Sent!'); closeModal(); renderNotifications(); };

async function renderPayments(){
  const all = await fetchAll('payments'); all.sort((a,b)=>(b.date?.toMillis?.()||0)-(a.date?.toMillis?.()||0));
  $('content').innerHTML = `<div class="section-title">💳 Payments</div>${all.length===0?'<div class="empty"><div class="big">💳</div>Koi payment nahi</div>':''}${all.map(p=>`<div class="item-card" style="flex-wrap:wrap"><div class="item-info"><h4>${esc(p.name||'—')} <span class="badge ${p.status==='approved'?'green':p.status==='rejected'?'red':'yellow'}">${p.status||'pending'}</span></h4><p>📚 ${esc(p.courseTitle||'')}<br>₹${p.amount||0} · UTR: ${esc(p.utr||'')}<br>📱 ${esc(p.mobile||'')}</p></div>${p.status==='pending'?`<div style="display:flex;gap:6px;width:100%;margin-top:8px"><button class="btn-primary" style="margin:0;background:var(--grad-green);padding:10px" onclick="approvePay('${p.id}')">✅ Approve</button><button class="btn-primary" style="margin:0;background:var(--grad-red);padding:10px" onclick="rejectPay('${p.id}')">❌ Reject</button></div>`:''}</div>`).join('')}`;
}
window.approvePay = async id => { await update('payments',id,{status:'approved',approvedAt:new Date()}); toast('✅ Approved'); renderPayments(); };
window.rejectPay = async id => { await update('payments',id,{status:'rejected',rejectedAt:new Date()}); toast('Rejected'); renderPayments(); };

async function renderDoubts(){
  const all = await fetchAll('doubts'); all.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  $('content').innerHTML = `<div class="section-title">❓ Doubts</div>${all.length===0?'<div class="empty"><div class="big">❓</div>Koi doubt nahi</div>':''}${all.map(d=>`<div class="item-card" style="flex-wrap:wrap"><div class="item-info"><h4>${esc(d.name||'—')} <span class="badge ${d.status==='resolved'?'green':'yellow'}">${d.status||'pending'}</span></h4><p>${esc(d.doubt||'')}<br><small>${esc(d.class||'')} · ${esc(d.mobile||'')}</small></p></div><div style="display:flex;gap:6px;width:100%;margin-top:8px">${d.mobile&&d.mobile!=='Not Provided'?`<a href="https://wa.me/91${esc(d.mobile)}" target="_blank" style="flex:1;background:var(--grad-green);color:#fff;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800;font-size:13px">💬 WhatsApp</a>`:''}${d.status!=='resolved'?`<button style="flex:1;background:var(--grad-primary);color:#fff;padding:10px;border-radius:10px;font-weight:800;font-size:13px" onclick="resolveDoubt('${d.id}')">✅ Resolve</button>`:''}</div></div>`).join('')}`;
}
window.resolveDoubt = async id => { await update('doubts',id,{status:'resolved'}); toast('Resolved'); renderDoubts(); };

async function renderUsers(){
  const all = await fetchAll('users'); const s = getSearch('users');
  const filtered = s ? all.filter(u=>(u.name||'').toLowerCase().includes(s)||(u.mobile||'').includes(s)) : all;
  $('content').innerHTML = `<div class="section-title">👥 Students (${all.length})</div>${searchBar('users','renderUsers','Search name / mobile...')}${filtered.length===0?'<div class="empty"><div class="big">👥</div>Koi user nahi</div>':''}${filtered.map(u=>`<div class="item-card"><div style="width:44px;height:44px;border-radius:50%;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0">${esc((u.name||'?').charAt(0).toUpperCase())}</div><div class="item-info"><h4>${esc(u.name||'—')}</h4><p><span class="badge blue">${esc(u.class||'—')}</span> ${esc(u.mobile||u.email||'')}</p></div></div>`).join('')}`;
}
</script>
</body>
